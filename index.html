<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title> Demo Recurrencia - CustomCheckout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="https://culqi.com/assets/images/brand/brand.svg"
      type="image/x-icon"
    />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
    />

    <style>
 
      #response1, #response2, #response3, #response4 {
        background-color: #9ed9ea;
      }
      strong {
        color: #327ab7;
      }
      .header-container {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white; 
        padding: 10px 20px; 
        width: 100%; 
      }

      .header-logo {
        height: 30 px; 
        margin-right: 15px; 
      }

      .header-title {
        color: #000000; 
        font-size: 26px;
        font-weight: 600; 
        font-family: 'Poppins', sans-serif; 
        text-align: center; 
      }

      .no-arrows::-webkit-outer-spin-button,
      .no-arrows::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

    </style>
  </head>

  <body class="w-full p-6 px-6 flex justify-center items-center">
    <div class="container mx-auto" >
      <div class="header-container">
        <img
          class="header-logo"
          src="https://culqi.com/assets/images/brand/brand.svg"
          alt="Culqi Logo"
        />
        <h1 class="header-title">DEMO RECURRENCIA - SUSCRIPCION</h1>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!--REGISTRAR PLAN:-->
        <div class="bg-white p-6 rounded-lg shadow-lg"">

          <div>
            <h1 class="font-bold text-purple-900 mb-6 text-2xl">1. Crear Plan</h1>
            <!-- form -->
            <form>
              <div class="flex space-x-2 mb-4">
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Nombre: </label>
                  <input type="text" 
                  class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                    id="name_plan" 
                    placeholder="Plan de prueba"
                    required
                  />
                </div>
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Nombre corto:</label>
                  <input type="text"
                  class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                    id="short_name"
                    placeholder="Nombre corto del plan"
                    required />
                </div>
              </div>
              <div>
                <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Descripcion:</label>
                <input type="text"
                class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                  id="description"
                  placeholder="Descripcion Plan de Prueba"
                  required />
              </div>

              <div>
                <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Imagen:</label>
                <div class="relative border border-purple-500 rounded-md p-4 w-full">
                  <span id="file-name" class="text-gray-600 mt-2"></span>
                  <input type="file" name="image" id="image" required>
                </div>
              </div>

              <br>
              <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Configuracion</label>
              <div class="flex space-x-2 mb-4"> 
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Monto</label>
                  <input type="number"
                    class="appearance-none no-arrows block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                    id="monto_plan"
                    placeholder="Min 300 a 500000"
                    required />
                </div>
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Moneda</label>
                  <select 
                  required
                  class="w-full px-3 py-2 bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                  id="moneda_plan">
                    <option value="PEN">PEN</option>
                    <option value="USD">USD</option>
                  </select>
                </div>
              </div>

              <div class="flex space-x-2 mb-4">
                <div class="flex-1">
                <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Frecuencia</label>
                <select 
                  required
                  class="w-full px-3 py-2 bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                  id="interval_unit_time">
                    <option value="1">Diario</option>
                    <option value="2">Semanal</option>
                    <option value="3">Mensual</option>
                    <option value="4">Anual</option>
                    <option value="5">Trimestral</option>
                    <option value="6">Semestral</option>
                  </select>
                </div>
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Cant. intervalos</label>
                  <input type="number"
                    class="appearance-none no-arrows block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                    id="interval_count"
                    placeholder="Cantidad intervalos entre cargos"
                    required />
                </div>
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Ciclo inicial</label>
                  <input type="number"
                    class="appearance-none no-arrows block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                    id="ciclo_inicial"
                    placeholder="Ciclos iniciales del plan"
                    required />
                </div>
              </div>  
              <div class="form-group">
                <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Información de cobro:</label>
                <input type="text"
                  class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                  id="pay_info" />
              </div>
              
              <!--boton-->
              <a id="crearPlan" 
              class="shadow bg-purple-500 hover:bg-purple-400 focus:shadow-outline focus:outline-none text-white font-bold py-2 px-4 rounded"
                >Crear Plan</a> <br>

            </form>
            <br /><br />
            <div class="panel panel-default" id="response-panel3">
              <div class="panel-heading">Response</div>
              <div class="panel-body" id="response3"></div>
            </div>
            
          </div>
        </div>

        <!--GUARDAR CLIENTE:-->
        <div class="bg-white p-6 rounded-lg shadow-lg">
          <h2 class="font-bold text-purple-900 mb-6 text-2xl">2. Registrar Cliente</h2>
          <div >
            <form>
              <div>
                <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Dirección:</label>
                <input type="text"
                    class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                    id="address" required/>
              </div>
              
              <div class="flex space-x-2 mb-4">
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Distrito:</label>
                  <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                      id="address_c" required />
                </div>
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">País:</label>
                  <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                      id="country" placeholder="Ingresar PE" required/>
                </div>
              </div>
              <div class="flex space-x-2 mb-4">
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Nombre:</label>
                  <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                      id="f_name" required/>
                </div>
                <div class="flex-1">
                    <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Apellidos:</label>
                    <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                        id="l_name" required/>
                </div>
              </div>
              <div class="flex space-x-2 mb-4">
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Email:</label>
                  <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                      id="email" required
                      placeholder="review10@correo.com"/>
                </div>
                <div class="flex-1">
                  <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">Celular:</label>
                  <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
                      id="phone" required 
                      placeholder="Número móvil (ej. 912345678)"/>
                </div>
              </div>
              
              <!-- boton CrearCliente -->
              <a id="crearCustomer" 
              class="shadow bg-purple-500 hover:bg-purple-400 focus:shadow-outline focus:outline-none text-white font-bold py-2 px-4 rounded"
              href="#"
                >Crear Cliente</a
              >
            </form>
            <br /><br />
            <div class="panel panel-default" id="response-panel1">
              <div class="panel-heading">Response</div>
              <div class="panel-body" id="response1"></div>
            </div>
 
            <br />
          </div>
        </div>
        <!--GUARDAR TARJETA:-->
        <div class="bg-white p-6 rounded-lg shadow-lg">
          <div>
            <h1 class="font-bold text-purple-900 mb-6 text-2xl">3. Guarda tu tarjeta</h1>
            <input
              id="idCustomer"
              class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
              type="text"
              placeholder="Ingresar id cliente (cus_test_xxxxxxxx)"
              value="" required
            />
            <!-- boton CrearTarjeta -->
            <a id="crearCard" class="shadow bg-purple-500 hover:bg-purple-400 focus:shadow-outline focus:outline-none text-white font-bold py-2 px-4 rounded" 
            href="#"
              >Crear Tarjeta</a
            ><br /><br />
            <div class="panel panel-default" id="response-panel2">
              <div class="panel-heading">Response</div>
              <div class="panel-body" id="response2"></div>
            </div>

            <h4 class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">O utiliza alguna de tus últimas tarjetas creadas:</h4>
            <div id="table-card-container"></div>

          </div>
        </div>
        <!-- CrearSuscripcion -->
         
        <div class="bg-white p-6 rounded-lg shadow-lg">
          <h1 class="font-bold text-purple-900 mb-6 text-2xl"> 4. Crea Suscripcion</h1>
          <div class="form-group">
            <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">id Plan:</label>
            <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            placeholder="Ingresar (plan_test_xxxxxxxx)"
            id="idPlan" required/>
          </div>
          <div class="form-group">
            <label class="block uppercase tracking-wide text-gray-700 text-sm font-bold mb-2">id Card:</label>
            <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
            placeholder="Ingresar (crd_test_xxxxxxxx)"
            id="idCard" required/>
          </div>

          <a  id="crearSuscripcion" 
          class="shadow bg-purple-500 hover:bg-purple-400 focus:shadow-outline focus:outline-none text-white font-bold py-2 px-4 rounded"
          href="#">Suscribirse</a>
          <br><br>
          <div class="panel panel-default" id="response-panel4">
            <div class="panel-heading">Response</div>
            <div class="panel-body" id="response4"></div>
          </div>        
        </div>
      </div>
    </div>
    <script src="https://js.culqi.com/checkout-js"></script>  <!--Customcheckout -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <!-- <script src="waitMe.min.js"></script> -->
    <!-- <script type="text/javascript" src="js/process.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.10.6/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.23/moment-timezone-with-data-2012-2022.min.js"></script>
    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script type="module" src="js/crearPlan.js"></script>
    <script type="module" src="js/crearCustomer.js"></script>
    <script type="module" src="js/crearCard.js"></script>
    <script type="module" src="js/eliminarCard.js"></script>
    <script type="module" src="js/listCards.js"></script>
    <script type="module" src="js/crearSuscripcion.js"></script>
  </body>
</html>
